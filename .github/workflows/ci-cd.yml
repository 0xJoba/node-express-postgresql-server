name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/0xjoba/node-express-postgresql-server:${{ github.sha }} \
            -t ghcr.io/0xjoba/node-express-postgresql-server:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/0xjoba/node-express-postgresql-server:${{ github.sha }}
          docker push ghcr.io/0xjoba/node-express-postgresql-server:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: kubectl set image deployment/node-api node-api=ghcr.io/0xjoba/node-express-postgresql-server:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/node-api
