apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
        - name: node-api
          image: node-express-postgresql-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE
              valueFrom:
                configMapKeyRef:
                  name: node-api-config
                  key: DATABASE
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: node-api-config
                  key: DATABASE_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: node-api-config
                  key: PORT
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /users
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /users
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
